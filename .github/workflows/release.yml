name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build deb + AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test
        run: npm test

      # No runtime is bundled into the artifacts: the app downloads adb, the emulator and
      # the system image on first launch. That keeps each artifact around 100 MB instead of
      # gigabytes, which matters for GitHub release limits and for CI minutes.
      - name: Build .deb and AppImage
        run: npx electron-builder --linux deb AppImage --publish never

      - name: List artefacts
        run: ls -lh dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/release/*.deb
            dist/release/*.AppImage
          if-no-files-found: error

      - name: Create release and upload artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES=".github/release-notes-${TAG}.md"
          gh release view "$TAG" >/dev/null 2>&1 || {
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --title "ApkStart ${TAG}" --notes-file "$NOTES"
            else
              gh release create "$TAG" --title "ApkStart ${TAG}" --generate-notes
            fi
          }
          for f in dist/release/*.deb dist/release/*.AppImage; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done
