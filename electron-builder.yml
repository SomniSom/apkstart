appId: com.apkstart.linux
productName: ApkStart
copyright: Copyright © 2026 ApkStart

directories:
  output: dist/release
  buildResources: build

# asar is disabled on purpose: the emulator/agent code resolves real filesystem paths and
# spawns binaries from the unpacked tree.
asar: false
files:
  - src/**/*
  - package.json
  - LICENSE
  - "!**/*.map"
  - "!**/node_modules/**"
  # Used to decompress .xz images at runtime (prebuilt NAPI, no ABI issues)
  - "node_modules/@napi-rs/lzma/**"
  - "node_modules/@napi-rs/lzma-linux-x64-gnu/**"
  - "!node_modules/@napi-rs/lzma/*.md"
  - "!node_modules/@napi-rs/lzma/*.ts"
  - "!node_modules/@napi-rs/lzma/browser-entry.*"

# Only the Electron locales we actually need (41 MB -> ~1 MB); UI and docs are English.
electronLanguages:
  - en-US

# Full runtime (emulator + platform-tools + system images), built by build/prepare-runtime.js.
# Once bundled, the first launch needs no downloads. Only included when the tree exists, so
# a plain `electron-builder` run (CI packages the download-on-demand flavour) stays quiet.
extraResources:
  - from: ${env.APKSTART_RUNTIME_DIR:-build/runtime}
    to: runtime
    filter:
      - "**/*"
      - "!.prepared"

# Linux: .deb for Debian/Ubuntu, AppImage for everything else.
linux:
  target:
    - AppImage
    - deb
    - dir
  category: Utility
  synopsis: Android app runner for Linux
  description: |
    ApkStart runs Android apps in their own windows: double-click an APK, it is installed
    through Android Emulator (KVM) and gets a desktop entry.
  icon: src/ui/assets/logo-128.png
  executableName: apkstart
  # The .desktop name comes from package.json's "desktopName" field in electron-builder 26;
  # there is no linux.desktopName key, only the sync switch.
  syncDesktopName: true
  maintainer: ApkStart Linux fork <noreply@example.invalid>
  vendor: ApkStart
  desktop:
    entry:
      Name: ApkStart
      Comment: Android app runner
      Categories: Utility;
      MimeType: application/vnd.android.package-archive;

appImage:
  artifactName: ApkStart-${version}-x86_64.AppImage

# Debian package: registers the .apk MIME type so file managers hand APKs over to us.
deb:
  artifactName: ApkStart-${version}-amd64.deb
  depends:
    - xdotool
    - wmctrl
    - qemu-utils
    - e2fsprogs
  recommends:
    - qemu-kvm
  priority: optional
  packageCategory: utils

# Compression: the Android image is already compressed, so only Electron benefits here.
compression: normal
